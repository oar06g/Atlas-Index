name: atlas-index

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 17 + pgvector - stores entries, categories and embeddings.
  # ---------------------------------------------------------------------------
  db:
    image: pgvector/pgvector:pg17
    container_name: pgvector-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas}
      POSTGRES_DB: ${POSTGRES_DB:-atlasdb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    configs:
      # The schema is embedded below so this Compose file works on its own.
      # It is applied automatically the first time the data volume is created.
      - source: init_sql
        target: /docker-entrypoint-initdb.d/10-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Ollama - local embedding service. Pulls the configured model on startup.
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-service
    restart: always
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-nomic-embed-text}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-24h}
      OLLAMA_HOST: 0.0.0.0:11434
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    configs:
      - source: ollama_entrypoint
        target: /usr/local/bin/ollama-entrypoint.sh
    entrypoint:
      - /bin/sh
      - -c
      - |
        tr -d '\r' < /usr/local/bin/ollama-entrypoint.sh > /tmp/ollama-entrypoint.sh
        exec /bin/sh /tmp/ollama-entrypoint.sh
    healthcheck:
      # Healthy only once the embedding model has actually been pulled.
      test: ["CMD-SHELL", "ollama list | grep -q \"$${OLLAMA_MODEL}\""]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Atlas Index - Next.js web UI + API.
  #
  # Uses the published image by default. To build from source, use the build
  # override: docker compose -f compose.yml -f compose.build.yml up --build
  #
  # Comment this service out if you prefer to run the app locally with
  # `npm run dev` while keeping only `db` and `ollama` in Docker.
  # ---------------------------------------------------------------------------
  app:
    image: ${ATLAS_IMAGE:-ghcr.io/oar06g/atlas-index:latest}
    container_name: atlas-index
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      # The database is configured through env only (see app/lib/db.ts).
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas}
      POSTGRES_DB: ${POSTGRES_DB:-atlasdb}
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-nomic-embed-text}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-24h}
      EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE:-4}
      EMBED_TIMEOUT_MS: ${EMBED_TIMEOUT_MS:-120000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
  ollama_data:

configs:
  # Keep in sync with queries/init.sql.
  init_sql:
    content: |
      -- Atlas Index database schema.
      -- Keep the queries/init.sql and compose.yml (init_sql) copies identical.

      CREATE EXTENSION IF NOT EXISTS vector;
      CREATE EXTENSION IF NOT EXISTS "pgcrypto"; -- gen_random_uuid()

      CREATE TABLE IF NOT EXISTS categories (
          id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
          name TEXT NOT NULL UNIQUE,
          created_at TIMESTAMPTZ DEFAULT NOW()
      );

      CREATE TABLE IF NOT EXISTS entries (
          id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
          title TEXT NOT NULL,
          slug TEXT UNIQUE,
          content TEXT NOT NULL,
          summary TEXT,
          type TEXT NOT NULL DEFAULT 'manual'
              CHECK (type IN ('manual', 'file', 'url')),
          status TEXT NOT NULL DEFAULT 'pending'
              CHECK (status IN ('pending', 'processing', 'embedded', 'failed')),
          error_message TEXT,
          category_id UUID REFERENCES categories(id) ON DELETE SET NULL,
          tags TEXT[] DEFAULT '{}',
          current_model_id TEXT,
          chunks_total INT NOT NULL DEFAULT 0,
          chunks_done INT NOT NULL DEFAULT 0,
          created_at TIMESTAMPTZ DEFAULT NOW(),
          updated_at TIMESTAMPTZ DEFAULT NOW()
      );

      -- For databases created before the progress columns were introduced.
      ALTER TABLE entries ADD COLUMN IF NOT EXISTS chunks_total INT NOT NULL DEFAULT 0;
      ALTER TABLE entries ADD COLUMN IF NOT EXISTS chunks_done INT NOT NULL DEFAULT 0;

      CREATE TABLE IF NOT EXISTS entry_chunks (
          id BIGSERIAL PRIMARY KEY,
          entry_id UUID NOT NULL REFERENCES entries(id) ON DELETE CASCADE,
          chunk_index INT NOT NULL,
          content TEXT NOT NULL,
          embedding vector NOT NULL,
          model_id TEXT NOT NULL,
          created_at TIMESTAMPTZ DEFAULT NOW()
      );

      CREATE TABLE IF NOT EXISTS settings (
          id INT PRIMARY KEY DEFAULT 1,
          provider TEXT NOT NULL DEFAULT 'ollama'
              CHECK (provider IN ('ollama', 'openai', 'custom')),
          model_id TEXT NOT NULL DEFAULT 'nomic-embed-text',
          dimensions INT NOT NULL DEFAULT 768,
          -- NULL means "use OLLAMA_HOST" for Ollama (or the provider default).
          base_url TEXT DEFAULT NULL,
          api_key TEXT,
          updated_at TIMESTAMPTZ DEFAULT NOW(),
          CONSTRAINT single_row CHECK (id = 1)
      );

      INSERT INTO settings (id) VALUES (1) ON CONFLICT DO NOTHING;

      -- Indexes
      CREATE INDEX IF NOT EXISTS idx_entries_category ON entries(category_id);
      CREATE INDEX IF NOT EXISTS idx_entries_status ON entries(status);
      CREATE INDEX IF NOT EXISTS idx_entries_current_model ON entries(current_model_id);
      CREATE INDEX IF NOT EXISTS idx_entries_tags ON entries USING GIN(tags);
      CREATE INDEX IF NOT EXISTS idx_entry_chunks_entry ON entry_chunks(entry_id);
      CREATE INDEX IF NOT EXISTS idx_entry_chunks_model ON entry_chunks(model_id);

      CREATE UNIQUE INDEX IF NOT EXISTS idx_entry_chunks_unique
      ON entry_chunks(entry_id, chunk_index);

  # Keep in sync with scripts/ollama-entrypoint.sh.
  ollama_entrypoint:
    content: |
      #!/bin/sh
      # Ollama startup script. Keep the compose.yml and scripts/ollama-entrypoint.sh
      # copies identical.
      set -eu

      # Pull the embedding model on startup (only downloads when missing) and keep
      # the Ollama server in the foreground so Docker can supervise it.
      OLLAMA_MODEL="$${OLLAMA_MODEL:-nomic-embed-text}"

      ollama serve &
      ollama_pid=$$!

      cleanup() {
        kill "$$ollama_pid" 2>/dev/null || true
        wait "$$ollama_pid" 2>/dev/null || true
      }

      trap cleanup EXIT
      trap 'exit 143' TERM
      trap 'exit 130' INT

      until ollama list >/dev/null 2>&1; do
        if ! kill -0 "$$ollama_pid" 2>/dev/null; then
          wait "$$ollama_pid"
          exit 1
        fi
        echo "Waiting for Ollama..."
        sleep 2
      done

      ollama pull "$$OLLAMA_MODEL"
      wait "$$ollama_pid"
