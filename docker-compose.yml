services:
  db:
    image: pgvector/pgvector:pg17
    container_name: pgvector-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: ollama-service
    restart: always
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-nomic-embed-text}
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./scripts/ollama-entrypoint.sh:/usr/local/bin/ollama-entrypoint.sh:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        tr -d '\r' < /usr/local/bin/ollama-entrypoint.sh > /tmp/ollama-entrypoint.sh
        exec /bin/sh /tmp/ollama-entrypoint.sh

volumes:
  postgres_data:
  ollama_data:
