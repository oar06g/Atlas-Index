services:
  app:
    build:
      context: .
    container_name: atlas-index
    ports:
      # Only the web app is published. The in-container Ollama API is an
      # internal implementation detail and is deliberately NOT published, so
      # it can never collide with an Ollama already running on the host.
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Internal PostgreSQL credentials (the app derives its connection
      # string from these; override with DATABASE_URL or the in-app
      # settings to use a different server)
      - POSTGRES_USER=atlas
      - POSTGRES_PASSWORD=atlas
      - POSTGRES_DB=atlasdb
      - OLLAMA_HOST=http://localhost:11434
      - OLLAMA_KEEP_ALIVE=24h
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ollama_data:/root/.ollama
      - app_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
  app_data:
